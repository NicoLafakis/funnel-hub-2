# Flywheel V2 CI (tech-architecture.md §5): logic + difficulty-invariant
# suites, build, and live-deployment mobile E2E on every PR and push to main.
# game-design.md §5: a level that fails an invariant blocks merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci also runs postinstall -> scripts/vendor-three.js (B1: both
      # vendored three files must exist for the import map).
      - run: npm ci

      # Logic suite + the 100-level difficulty-invariant soak.
      - name: Unit + invariant suites
        run: npm test

      - name: Build (dist/)
        run: node scripts/build.js

      # The E2E scripts load the playwright package via
      # $APPDATA/npm/node_modules/playwright (the Windows npm-global layout,
      # from the dev machine). Recreate that layout on Linux by linking the
      # npm-global install into a shim APPDATA dir — no repo changes needed.
      - name: Install Playwright + chromium
        run: |
          npm install -g playwright
          npx playwright install chromium --with-deps
          mkdir -p "${{ runner.temp }}/ci-appdata/npm/node_modules"
          ln -s "$(npm root -g)/playwright" "${{ runner.temp }}/ci-appdata/npm/node_modules/playwright"

      - name: Live mobile touch matrix
        env:
          APPDATA: ${{ runner.temp }}/ci-appdata
          LIVE_URL: ${{ vars.FLYWHEEL_LIVE_URL }}
        run: npm run test:e2e
